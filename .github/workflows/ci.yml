name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Client quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Pin Java explicitly instead of relying on the runner image to ship a JRE. The
      # generation drift check silently becomes a no-op if java disappears, and this
      # is the one environment that must always catch contract drift.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
        env:
          # The gate type-checks the Electron package and example; it never starts Electron.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run check

  dotnet-tests:
    name: .NET packages and example tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # The WPF projects compile on Linux through EnableWindowsTargeting; the SQL Server tests
      # start a container through Testcontainers on the runner's Docker.
      - run: dotnet test widgets/wpf/NevaBridge.Wpf.sln
      - run: dotnet test samples/dotnet-wpf/NevaBridge.WpfSample.sln
      - run: dotnet format samples/dotnet-wpf/NevaBridge.WpfSample.sln --verify-no-changes
      - run: dotnet format widgets/wpf/NevaBridge.Wpf.sln --verify-no-changes

  dotnet-windows-build:
    name: WPF build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build samples/dotnet-wpf/NevaBridge.WpfSample.sln -c Release
      - run: dotnet pack widgets/wpf/src/NevaBridge.Wpf -c Release -o out
