name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Client quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Pin Java explicitly instead of relying on the runner image to ship a JRE. The
      # generation drift check silently becomes a no-op if java disappears, and this
      # is the one environment that must always catch contract drift.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun run check
