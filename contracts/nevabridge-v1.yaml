openapi: 3.1.0

info:
  title: NevaBridge Tenant Integration API
  version: "1.0.0"
  summary: The supported NevaBridge operations for a tenant's own backend.
  description: |
    This contract covers the operations a tenant's trusted backend may call to run a
    NevaBridge reporting conversation, attach files to it, and finalize the report
    it produces.

    **Supported surface.** Only the operations in this document are supported
    commitments. A NevaBridge API key is tenant-wide and the gateway does not
    restrict it to these paths, so other routes may answer a request; they are
    internal, may change without notice, and are not covered by any compatibility
    promise. Build against this document only.

    **Trust boundary.** The caller is the tenant's backend, not a browser. The API
    key must never reach an end user's device. `X-Actor-Id` is a correlation value
    the tenant chooses and NevaBridge stores verbatim; it is not an authorization
    boundary, and NevaBridge does not check that a caller "owns" the actor it names.
    `X-Actor-Roles` is trusted audience context from that backend. Tenant isolation
    comes from the API key alone.

    **Feature entitlements.** Some behavior depends on features NevaBridge enables
    per tenant. A system-wide setting can switch a feature on or off for every
    tenant; otherwise the tenant's own entitlement decides. NevaBridge staff manage
    both, so ask NevaBridge to enable a feature. Each affected operation names its
    feature in its description and in `x-nevabridge-entitlements`:

    - `chatAttachments`: every Attachments operation. Without it they answer 403
      `Forbidden`, whose message names the feature. With it, a report delivered
      to a tracker while its conversation holds uploaded files also carries an
      attachment count and a link to the files in NevaBridge. Revoking the
      entitlement keeps the files; granting it again makes them reachable again.
    - `knowledgebase`: `startConversation` and `appendMessage`. With it, and once
      the tenant's knowledge base is ready, the assistant grounds its replies in
      the tenant's documents that the conversation's `X-Actor-Roles` may read.
      Without it, turns run the same way with no document retrieval and no
      error, and `X-Actor-Roles` has no effect.
    - `genericIntake`: `startIntakeConversation` starts a Generic Intake
      conversation, in which the assistant works out what the reporter needs
      and files one report per finding when the conversation ends. Without
      the entitlement it answers 403 `Forbidden`. `startIntakeTurn` continues
      and finishes those conversations, `getIntakeTurnEvents` follows a
      running turn, `listIntakeConversations` lists the conversations and
      `getConversation` reads them. `listConversations` leaves them out, and
      `appendMessage` refuses them. The Attachments operations accept them.

    **Generic Intake turns run in the background.** Starting a conversation or
    a turn answers 202 at once with a turn id; the assistant's reply is not in
    that response. Read the turn's progress and reply with
    `getIntakeTurnEvents` until its terminal event, then read the conversation
    with `getConversation`. Every request stays short, so no turn depends on a
    request's time limit. `getIntakeTurnEvents` describes the polling rules.

    `getFeatures` reports which of these features the tenant has right now.

    Every other behavior in this document is the same for all tenants.

servers:
  - url: https://tenant.api.nevabridge.com
    description: Production
  - url: https://tenant.api.sandbox.nevabridge.com
    description: Sandbox

security:
  - bearerAuth: []

tags:
  - name: Conversations
    description: Running a reporting conversation and reading it back.
  - name: Reports
    description: Finalizing the structured report a conversation produced.
  - name: Features
    description: The gated features the tenant can use right now.
  - name: Attachments
    description: |
      Files a reporter attaches to a conversation for the engineer who handles the
      report. The assistant never reads them. Requires the `chatAttachments`
      entitlement.

paths:
  /v1/products/{productId}/conversations:
    post:
      operationId: startConversation
      summary: Start a conversation
      description: |
        Starts a reporting conversation for one product and posts its first user
        message in the same call. The response carries that message, the
        assistant's reply, and the reports the turn produced.

        This is the only operation that establishes the reporter's identity, so
        `X-Actor-Id` is required here and not accepted as an identity on later
        calls. (`requestAttachmentUpload` reads it separately, to label who
        uploaded a file.)

        With the `knowledgebase` entitlement, the assistant's reply may draw on
        the tenant's knowledge base, limited to the documents `X-Actor-Roles`
        grants. Without it, the turn runs without retrieval.
      tags: [Conversations]
      x-nevabridge-entitlements: [knowledgebase]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorName"
        - $ref: "#/components/parameters/ActorRoles"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationRequest"
            examples:
              minimal:
                summary: A first message and nothing else
                value:
                  userMessage:
                    content: The checkout page shows a blank screen after I click Pay.
              withApplicationContext:
                summary: With the reporting application's own context
                value:
                  userMessage:
                    content: The checkout page shows a blank screen after I click Pay.
                  applicationContext:
                    accountId: acct-4821
                    plan: business
                    environment: production
      responses:
        "201":
          description: The conversation was created and the first turn completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTurn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "409":
          description: |
            The model is unavailable for a permanent reason (access-denied or
            model-retired; the body is a ModelInvocationError). Or the product
            is archived (`ProductArchived`) or being deleted (`ProductPurging`);
            the message says which.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ModelInvocationError"
                  - $ref: "#/components/schemas/Error"
        "408":
          $ref: "#/components/responses/ModelInvocationFailure"
        "422":
          $ref: "#/components/responses/RequestRejectedOrConfigurationFailure"
        "424":
          $ref: "#/components/responses/DependencyFailure"
        "429":
          $ref: "#/components/responses/ModelInvocationFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

    get:
      operationId: listConversations
      summary: List a product's conversations
      description: |
        Lists the conversations NevaBridge holds for one product, ordered by
        `updatedAt` ascending, so the most recently active conversation comes
        last. Pass `reporterId` to narrow the list to a single reporter, which is
        how a tenant backend renders "my reports" for the signed-in user.

        Summaries carry no messages. Read one conversation to get its transcript
        and reports.

        Generic Intake conversations are not listed here; use
        `listIntakeConversations`.
      tags: [Conversations]
      x-nevabridge-entitlements: [genericIntake]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: reporterId
          in: query
          required: false
          description: |
            Return only conversations whose `reporterId` matches this value
            exactly. It is the same value the tenant sent as `X-Actor-Id` when
            starting the conversation. A value that matches nothing yields an
            empty list rather than an error, and filtering is not an
            authorization check: any reporter's conversations are reachable
            without it.
          schema:
            type: string
          example: user-4821
      responses:
        "200":
          description: The product's conversations, filtered when `reporterId` was given.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The product is being deleted permanently (`ProductPurging`) and can
            no longer be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/products/{productId}/intake-conversations:
    post:
      operationId: startIntakeConversation
      summary: Start a Generic Intake conversation
      description: |
        Starts a Generic Intake conversation for one product with its first
        user message. In Generic Intake the assistant works out what the
        reporter needs, answers from the tenant's knowledge where it can, and
        files one report per distinct finding when the conversation ends.

        The call answers 202 with the new conversation's id and the id of its
        first turn, which runs in the background. Read the turn with
        `getIntakeTurnEvents` until it ends: after `done`, `getConversation`
        returns the first message, the assistant's reply and the
        conversation's `revision`. A first turn that ends in `error` changed
        nothing, and its conversation is deleted again; start a new one.
        Continue and finish the conversation with `startIntakeTurn`.

        Requires the `genericIntake` entitlement; without it the call answers
        403 `Forbidden`.

        `X-Actor-Id` is required and becomes the conversation's `reporterId`,
        as in `startConversation`.

        Send `reporterContact` when the tenant's application already knows how
        to reach the reporter. The assistant then does not ask for contact
        details, and every support request filed from the conversation carries
        them. This works with report templates that hold contact details in
        fields keyed `contactEmail` and `contactPhone`, as the default support
        template does.

        With the `knowledgebase` entitlement, the assistant's replies may draw
        on the tenant's knowledge base, limited to the documents
        `X-Actor-Roles` grants.
      tags: [Conversations]
      x-nevabridge-entitlements: [genericIntake, knowledgebase]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorName"
        - $ref: "#/components/parameters/ActorRoles"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIntakeConversationRequest"
            examples:
              minimal:
                summary: A first message and nothing else
                value:
                  userMessage:
                    content: I cannot find where to change my opening hours.
              withReporterContact:
                summary: For a signed-in user whose contact details the application knows
                value:
                  userMessage:
                    content: I cannot find where to change my opening hours.
                  applicationContext:
                    screen: settings
                  reporterContact:
                    email: dana@example.com
      responses:
        "202":
          description: |
            The conversation was created and its first turn started. Model
            failures, an exhausted credit budget and every other failure of
            the turn itself arrive as the turn's `error` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeConversationStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The tenant does not have the `genericIntake` entitlement, whose name
            the message gives, or the key's tenant may not reach the product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The product is archived (`ProductArchived`) or being deleted
            (`ProductPurging`); the message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "424":
          $ref: "#/components/responses/TurnStartFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

    get:
      operationId: listIntakeConversations
      summary: List a product's Generic Intake conversations
      description: |
        Lists one product's Generic Intake conversations, one page at a time.
        Pass `reporterId` to list a single reporter's conversations, newest
        first, which is how a tenant backend renders "my conversations" for the
        signed-in user. Without it, the list pages through all of the product's
        Generic Intake conversations in a stable order that is not
        chronological.

        A page can hold fewer than `limit` conversations, even none, while more
        follow: only a response without `nextCursor` ends the list. To read the
        next page, send `nextCursor` back as `cursor` with the same `reporterId`.

        A conversation started a moment ago can take a moment to appear in the
        list filtered by `reporterId`.

        Summaries carry no messages. Read one conversation to get its
        transcript and reports. Listing needs no entitlement. Conversations
        from the first Generic Intake version, which predates this API, are
        not listed.
      tags: [Conversations]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: reporterId
          in: query
          required: false
          description: |
            Return only conversations whose `reporterId` matches this value
            exactly. It is the same value the tenant sent as `X-Actor-Id` when
            starting the conversation. Filtering is not an authorization check:
            any reporter's conversations are reachable without it.
          schema:
            type: string
            minLength: 1
          example: user-4821
        - name: limit
          in: query
          required: false
          description: The most conversations one page holds.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page, unchanged. It is opaque and
            valid only with the same `productId` and `reporterId`; any other
            value answers 400.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: One page of the product's Generic Intake conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeConversationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The product is being deleted permanently (`ProductPurging`) and can
            no longer be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/intake-conversations/{conversationId}/turns:
    post:
      operationId: startIntakeTurn
      summary: Start a Generic Intake turn
      description: |
        Sends the reporter's next message in a Generic Intake conversation, or
        finishes the conversation. The call answers 202 with the turn's id;
        the turn runs in the background. Read it with `getIntakeTurnEvents`
        until it ends, then read the conversation with `getConversation`,
        whose `revision` is the `expectedRevision` of the next turn.

        Send `finish: true` to end the conversation: every draft is filed
        without a model call, and `content` is stored as the reporter's
        closing message without being analyzed. A finishing turn has ended by
        the time the call answers, so its first `getIntakeTurnEvents` read
        returns `done` at once. Finishing needs no entitlement; any other turn
        requires `genericIntake` and answers 403 `Forbidden` without it. A
        Generic Intake conversation also finishes on its own when the
        assistant reads the reporter's message as an ending, or after 60
        minutes without a turn.

        **One turn at a time, and safe resends.** `expectedRevision` is the
        `revision` of the last read of the conversation, or of the last turn's
        `done` event. While another turn of the conversation runs, the call
        answers 409 `IntakeTurnRunning` with that turn's `turnId`: read its
        events instead of sending again. Once a turn has committed, a resend
        of the same message names a revision the conversation has moved past
        and answers 409 `RevisionConflict` without adding anything; read the
        conversation to see the reply. A request whose response was lost can
        therefore always be sent again unchanged.

        The reporter's identity was fixed when the conversation started, so
        `X-Actor-Id` is neither required nor read here. With the
        `knowledgebase` entitlement, the reply may draw on the tenant's
        knowledge base as described for `startIntakeConversation`.
      tags: [Conversations]
      x-nevabridge-entitlements: [genericIntake, knowledgebase]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIntakeTurnRequest"
            examples:
              message:
                summary: The reporter's next message
                value:
                  content: It happens on every attempt, in Chrome and Safari.
                  expectedRevision: 1
              finish:
                summary: The reporter is done
                value:
                  content: That is all, thank you.
                  finish: true
                  expectedRevision: 3
      responses:
        "202":
          description: |
            The turn started. Model failures, an exhausted credit budget and
            every other failure of the turn itself arrive as its `error` event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeTurnStarted"
        "400":
          description: |
            The body failed validation, or the conversation does not exist
            within the caller's tenant, is not a Generic Intake conversation,
            or is already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The tenant does not have the `genericIntake` entitlement, whose name
            the message gives, or the key's tenant may not reach the product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Another turn of the conversation is running (`IntakeTurnRunning`,
            naming it), the conversation has moved past `expectedRevision`
            (`RevisionConflict`), the conversation is archived or being
            deleted, or the product is archived (`ProductArchived`) or being
            deleted (`ProductPurging`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IntakeTurnRunningError"
                  - $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "424":
          $ref: "#/components/responses/TurnStartFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/intake-turns/{turnId}/events:
    get:
      operationId: getIntakeTurnEvents
      summary: Read a Generic Intake turn's events
      description: |
        Returns the events a Generic Intake turn has written after `after`,
        oldest first. A turn writes `status` events while the assistant
        works, `text` events with its reply as it is written, and ends in
        exactly one terminal event: `done` once its changes are saved, or
        `error` when they never will be. A turn that cannot finish within
        five minutes ends in `error` (`IntakeTurnTimedOut`) and changed
        nothing.

        **Polling.** Send no `after` on the first read, then the previous
        response's `cursor` each time. The cursor is opaque; do not build or
        compare it. Across reads the events have no gaps and no repeats.
        - The read waits up to `wait` seconds (0 to 20, default 20) for a
          first new event and answers with none when the wait runs out; read
          again.
        - Once an event has arrived, it keeps collecting for `linger`
          milliseconds (0 to 3000, default 500), so text arrives in a few
          larger pieces.
        - The terminal event answers at once and always comes last.
        `finished` is true once it has been returned; read no further. A
        client that cannot hold a request open, such as a proxy with a short
        time limit, sends `wait=0` and reads again after a pause of its own.

        **After `done`,** read the conversation with `getConversation`: it
        is authoritative, and the `text` events are only a preview of the
        reply. `done` carries the conversation's new `revision`. After
        `error`, the conversation is unchanged; the error body says why, with
        the status code the request would have had.

        **Tolerance.** Ignore event types you do not know, and treat a
        `status` phase or tool you do not know as work in progress: both
        sets grow without a new API version.

        Events stay readable for 24 hours. A turn is readable by any key of
        its tenant; another tenant's turn answers 400.
      tags: [Conversations]
      parameters:
        - name: turnId
          in: path
          required: true
          description: The turn `startIntakeConversation` or `startIntakeTurn` returned.
          schema:
            $ref: "#/components/schemas/IntakeTurnId"
        - name: after
          in: query
          required: false
          description: The `cursor` of the previous read, unchanged. Absent reads from the first event.
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: How many seconds to wait for a first new event.
          schema:
            type: integer
            minimum: 0
            maximum: 20
            default: 20
        - name: linger
          in: query
          required: false
          description: How many milliseconds to keep collecting once an event has arrived.
          schema:
            type: integer
            minimum: 0
            maximum: 3000
            default: 500
      responses:
        "200":
          description: The events after the cursor, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeTurnEvents"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Read a conversation
      description: |
        Returns one conversation with its full message history and its current
        reports. Use it to render a transcript, and to poll for a report that a
        turn or the abandonment fallback has since finalized.

        A Generic Intake conversation (see the `genericIntake` entitlement)
        answers in the same shape. Its `status` is `closed` once the
        conversation has ended, its `reports` hold the reports filed so far,
        and `revision` is the value to send as `expectedRevision` with the next
        `startIntakeTurn`. While a turn runs, `activeTurnId` names it, and its
        message is not in `messages` yet: a client that lost track of a turn,
        for example after a reload, resumes reading its events with that id.
        The assistant's working drafts are not exposed.
        Reading needs no entitlement. `reporterId` is returned so the tenant's
        backend can apply its own rules about who may see a conversation;
        NevaBridge does not apply any.
        A conversation from the first Generic Intake version, which predates
        this API, answers 400.
      tags: [Conversations]
      x-nevabridge-entitlements: [genericIntake]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
      responses:
        "200":
          description: The conversation, its messages, and its reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The product is being deleted permanently (`ProductPurging`) and can
            no longer be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/conversations/{conversationId}/messages:
    post:
      operationId: appendMessage
      summary: Append a turn
      description: |
        Posts the reporter's next message and returns the assistant's reply along
        with the conversation's complete report array. The array is never a
        delta, so a live UI can redraw from this response without a follow-up
        read.

        The reporter's identity was fixed when the conversation started, so
        `X-Actor-Id` is neither required nor read here.

        With the `knowledgebase` entitlement, the reply may draw on the tenant's
        knowledge base as described for `startConversation`.

        A Generic Intake conversation answers 400 and adds nothing: its turns
        run in the background through `startIntakeTurn`, which the message
        names.
      tags: [Conversations]
      x-nevabridge-entitlements: [knowledgebase]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendMessageRequest"
            examples:
              minimal:
                summary: The reporter's next message
                value:
                  content: It happens on every attempt, in Chrome and Safari.
      responses:
        "200":
          description: The turn completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTurn"
        "400":
          description: |
            The body or path failed validation, the conversation does not
            exist within the caller's tenant, or it is a Generic Intake
            conversation, which takes its turns through `startIntakeTurn`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "409":
          description: The model is unavailable for a permanent reason (access-denied or model-retired), report submission currently owns the report, or the product is archived (`ProductArchived`) or being deleted (`ProductPurging`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ModelInvocationError"
                  - $ref: "#/components/schemas/Error"
        "408":
          $ref: "#/components/responses/ModelInvocationFailure"
        "422":
          $ref: "#/components/responses/RequestRejectedOrConfigurationFailure"
        "424":
          $ref: "#/components/responses/DependencyFailure"
        "429":
          $ref: "#/components/responses/ModelInvocationFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/conversations/{conversationId}/reports/{reportId}/submit:
    post:
      operationId: submitReport
      summary: Submit a report
      description: |
        Finalizes one report and delivers it to the product's active connectors.
        Call it when the reporter says they are done.

        **Do not build an inactivity timer.** NevaBridge already finalizes an
        abandoned conversation server-side: the window arms when the conversation
        starts, resets on every turn, and elapses 60 minutes after the last one.
        A sweep runs every 10 minutes, so an abandoned conversation is normally
        finalized 60 to 70 minutes after its final turn, through the same
        delivery path as an explicit submit. Anything that finalizes the report
        disarms the window: this operation, a turn in which the assistant judged
        the report complete and submitted it, closing the conversation, or
        archiving it. Reproducing that timer client-side causes duplicate and
        racing submissions.

        Submitting a report that has already reached a terminal state is
        idempotent: it returns the report as it stands and does not deliver it
        twice. If another caller still owns finalization or delivery recovery,
        this operation returns 409 Conflict. Retry after that work has had time
        to finish or its recovery lease has expired. A `deleteAttachment` call in
        flight on the same conversation also holds submission back for up to
        a minute, with the same 409.

        Submitting closes the conversation's attachments: the files stay
        readable, but none can be added or removed. When the conversation holds
        uploaded files (see the `chatAttachments` entitlement), each delivered
        tracker issue states how many and links to them in NevaBridge.
      tags: [Reports]
      x-nevabridge-entitlements: [chatAttachments]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
        - name: reportId
          in: path
          required: true
          description: The report to finalize, from the conversation's `reports` array.
          schema:
            $ref: "#/components/schemas/ReportId"
      responses:
        "200":
          description: |
            The report is finalized. When the product has active connectors, the
            per-connector delivery outcome comes back with it; a connector
            failure is reported here rather than failing the submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitReportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/SubmissionConflict"
        "408":
          $ref: "#/components/responses/ModelInvocationFailure"
        "422":
          $ref: "#/components/responses/RequestRejectedOrConfigurationFailure"
        "424":
          $ref: "#/components/responses/DependencyFailure"
        "429":
          $ref: "#/components/responses/ModelInvocationFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/conversations/{conversationId}/attachments:
    get:
      operationId: listAttachments
      summary: List a conversation's attachments
      description: |
        Returns the files attached to one conversation. Listing keeps working
        after the conversation closed.

        Confirmed uploads are listed. An unconfirmed upload is not listed while
        its upload URL is live. Once the URL has expired (plus a margin of about
        a minute), this call settles it: if its bytes arrived at the declared
        size and the conversation is still open, the file is attached as if
        confirmed and listed; otherwise it is discarded, never listed, and its
        place and bytes are given back.

        Requires the `chatAttachments` entitlement (403 otherwise).
      tags: [Attachments]
      x-nevabridge-entitlements: [chatAttachments]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
      responses:
        "200":
          description: The conversation's confirmed attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AttachmentsForbidden"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/conversations/{conversationId}/actions/request-attachment-upload:
    post:
      operationId: requestAttachmentUpload
      summary: Request an upload URL for one file
      description: |
        Admits one file to an open conversation and returns a presigned URL to
        upload it to. Uploading is three steps:

        1. Call this operation with the file's name and exact size.
        2. `PUT` exactly `sizeBytes` bytes to `uploadUrl` with the header
           `If-None-Match: *`. The size and uploader are signed into the URL,
           so storage refuses any other length. The URL accepts a single
           upload and stops working at `expiresAt`, 15 minutes after issue.
        3. Call `confirmAttachmentUpload` with the returned `attachmentId`.

        An admitted file holds one of the conversation's 10 places and its
        size in the tenant's 5 GB allowance from this call on. An upload that
        is never confirmed holds both until its URL has expired and
        `listAttachments` next settles it (see there: arrived bytes are then
        attached anyway). `deleteAttachment` gives the place back at once and
        the bytes as described there.

        The file type is taken from the name's extension, matched
        case-insensitively: `png`, `jpg`, `jpeg`, `gif`, `webp`, `mp4`, `mov`,
        `webm`, `txt`, `log`, `md`, `csv`, `json`, `xml`, `yaml`, `yml`.
        Anything else, including SVG and HTML, is refused.

        `X-Actor-Id` is required and recorded as the uploader, `api:<X-Actor-Id>`.

        A conversation is open for attachments until its report is submitted
        or submission of it starts. A Generic Intake conversation is open until
        it ends.

        Requires the `chatAttachments` entitlement (403 otherwise).
      tags: [Attachments]
      x-nevabridge-entitlements: [chatAttachments]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
        - $ref: "#/components/parameters/UploaderActorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAttachmentUploadRequest"
            examples:
              log:
                summary: A browser console log
                value:
                  fileName: console.log
                  sizeBytes: 48213
      responses:
        "200":
          description: The file is admitted; upload it to `uploadUrl`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAttachmentUploadResponse"
        "400":
          description: |
            The request failed validation, the conversation does not exist in
            the caller's tenant, the file type is not accepted
            (`UnsupportedAttachmentType`), or the conversation no longer accepts
            attachments (`ConversationNotOpenForAttachments`). The message says
            which and what to do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The `Authorization` header is missing, malformed, or names a key
            NevaBridge does not accept, or `X-Actor-Id` is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          $ref: "#/components/responses/StorageAllowanceExceeded"
        "403":
          $ref: "#/components/responses/AttachmentsForbidden"
        "409":
          description: |
            The conversation already holds 10 files, counting admitted uploads
            not yet confirmed (`AttachmentLimitReached`); delete one first. Or
            the conversation changed while the file was being admitted
            (`Conflict`); retry. Or the product is archived (`ProductArchived`) or being deleted
            (`ProductPurging`); the message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is larger than 100 MB (`PayloadTooLarge`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "424":
          $ref: "#/components/responses/StorageFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/conversations/{conversationId}/actions/confirm-attachment-upload:
    post:
      operationId: confirmAttachmentUpload
      summary: Confirm an uploaded file
      description: |
        Confirms that the bytes for an admitted file arrived, after which the
        file is listed and can be opened. Confirming a file that is already
        confirmed returns it again.

        Requires the `chatAttachments` entitlement (403 otherwise).
      tags: [Attachments]
      x-nevabridge-entitlements: [chatAttachments]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCommandRequest"
      responses:
        "200":
          description: The file is attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          description: |
            The request failed validation, the conversation or attachment does
            not exist in the caller's tenant, or the conversation no longer
            accepts attachments (`ConversationNotOpenForAttachments`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AttachmentsForbidden"
        "409":
          description: |
            The bytes have not arrived yet, or arrived with a size other than
            the one declared and were discarded (`AttachmentNotUploaded`; the
            message says which). Or the conversation changed while confirming
            (`Conflict`); retry. Or the product is archived (`ProductArchived`) or being deleted
            (`ProductPurging`); the message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "424":
          $ref: "#/components/responses/StorageFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/conversations/{conversationId}/actions/request-attachment-download-url:
    post:
      operationId: requestAttachmentDownloadUrl
      summary: Request a download URL for one file
      description: |
        Returns a presigned URL that serves one confirmed file for 5 minutes.
        The content type is chosen by NevaBridge from the file's extension,
        never taken from the upload; text files are always served as
        `text/plain; charset=utf-8`. Works after the conversation closed.

        Requires the `chatAttachments` entitlement (403 otherwise).
      tags: [Attachments]
      x-nevabridge-entitlements: [chatAttachments]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCommandRequest"
      responses:
        "200":
          description: A short-lived URL for the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentDownloadUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AttachmentsForbidden"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "424":
          $ref: "#/components/responses/StorageFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/conversations/{conversationId}/actions/delete-attachment:
    post:
      operationId: deleteAttachment
      summary: Delete one file
      description: |
        Removes one file, confirmed or still uploading, from an open
        conversation. Its place is given back at once. Its bytes are given
        back at once too, unless its upload URL is still live: then they stay
        reserved until the URL has expired and `listAttachments` next settles
        the file, so an upload through the old URL cannot outrun the
        allowance. Deleting a file that is already gone answers 204 again.

        Requires the `chatAttachments` entitlement (403 otherwise).
      tags: [Attachments]
      x-nevabridge-entitlements: [chatAttachments]
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCommandRequest"
      responses:
        "204":
          description: The file is gone.
        "400":
          description: |
            The request failed validation, the conversation does not exist in
            the caller's tenant, or the conversation no longer accepts changes
            to its attachments (`ConversationNotOpenForAttachments`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AttachmentsForbidden"
        "409":
          description: |
            The file, the conversation, or another deletion on the same
            conversation changed at the same time (`Conflict`). Retry.
            Or the product is archived (`ProductArchived`) or being deleted
            (`ProductPurging`); the message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ConfigurationFailure"
        "424":
          $ref: "#/components/responses/StorageFailure"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

  /v1/features:
    get:
      operationId: getFeatures
      summary: Read the tenant's features
      description: |
        Returns the tenant's effective entitlement for every feature this
        document names in `x-nevabridge-entitlements`: the system-wide setting
        when there is one, otherwise the tenant's own entitlement. A client can
        use it to show a gated control only when its feature is on.

        The answer reflects the moment of the call. NevaBridge staff can revoke
        a feature at any time, so a client that caches the answer must still
        handle a gated operation's 403 `Forbidden`. `X-Actor-Id` is not needed.
      tags: [Features]
      responses:
        "200":
          description: One boolean per documented feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/EdgeFailure"
        "504":
          $ref: "#/components/responses/EdgeFailure"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A NevaBridge API key for the tenant, sent as `Authorization: Bearer <key>`.
        The key is an opaque secret, not a JWT, and is not exchanged for a
        short-lived token. It identifies the tenant; every request is scoped to
        that tenant's data.

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: The NevaBridge product the conversation belongs to.
      schema:
        $ref: "#/components/schemas/ProductId"
      example: product-2f6a1c58-51b7-4a0e-9d0e-63a8b0e5c111

    ConversationIdPath:
      name: conversationId
      in: path
      required: true
      description: The conversation to act on.
      schema:
        $ref: "#/components/schemas/ConversationId"
      example: conversation-8c41d0f2-9a3e-4a77-b0c1-1d2e3f4a5b6c

    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: |
        The reporter's identity in the tenant's own vocabulary, stored verbatim as
        the conversation's `reporterId`. Use a stable value so later calls can
        filter a reporter's conversations. Correlation only: it carries no
        authorization meaning.
      schema:
        type: string
        minLength: 1
      example: user-4821

    ActorName:
      name: X-Actor-Name
      in: header
      required: false
      description: |
        A human-readable label for the reporter, shown to NevaBridge staff in
        triage. Display only. Percent-encode it if it may contain non-ASCII
        characters.
      schema:
        type: string
      example: dana%40example.com

    ActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      description: |
        Audience grants established for the lifetime of this conversation. Values
        are case-sensitive. Send every applicable role because roles do not imply
        one another. Unknown values are ignored; omission produces the anonymous
        retrieval baseline. This header is accepted only when starting a
        conversation.
      style: simple
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/ActorRole"
      example: [anonymous, customer]

    UploaderActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: |
        Who is uploading, in the tenant's own vocabulary. Recorded on the file as
        `api:<value>` and shown to the engineer who opens it. Correlation only:
        it carries no authorization meaning and need not match the
        conversation's `reporterId`.
      schema:
        type: string
        minLength: 1
      example: user-4821

  responses:
    BadRequest:
      description: |
        The request body or path failed validation, or a resource it names does
        not exist within the caller's tenant. NevaBridge answers a missing
        resource on an existing endpoint with 400, not 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: The `Authorization` header is missing, malformed, or names a key NevaBridge does not accept.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: The key is valid but its tenant may not reach the requested resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    QuotaExceeded:
      description: The tenant has no credit budget or has exhausted it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ModelInvocationFailure:
      description: |
        A model invocation failed. The status and `category` identify the
        operational response: 429 is throttled; 424 is transient-unavailable,
        output-unparseable, or unknown; 408 is timed-out; 409 is access-denied
        or model-retired; and 422 is request-rejected. NevaBridge never
        reports a handled failure with 502 or 504; those come from the edge.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelInvocationError"

    ConfigurationFailure:
      description: |
        NevaBridge detected a configuration fault it cannot resolve for this
        request. The body is a generic Error named ConfigurationError.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RequestRejectedOrConfigurationFailure:
      description: |
        Either the model provider rejected the request (a ModelInvocationError
        with category request-rejected), or NevaBridge detected a
        configuration fault it cannot resolve for this request (a generic
        Error named ConfigurationError).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ModelInvocationError"

    DependencyFailure:
      description: |
        A service NevaBridge depends on failed while handling the request. A
        ModelInvocationError means the model provider was temporarily
        unavailable (transient-unavailable), returned an unusable response
        (output-unparseable), or failed in an unrecognized way (unknown); all
        three are retryable. A generic Error named FailedDependency means
        another upstream, such as event delivery, failed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ModelInvocationError"

    TurnStartFailure:
      description: |
        The turn could not be started (`FailedDependency`). Nothing was
        created or changed; send the request again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EdgeFailure:
      description: |
        API Gateway or the Lambda runtime gave up before NevaBridge handled
        the request; 502 typically means the request ran past the 29-second
        limit. The body is API Gateway's own and has no `error` field, which
        is how a client tells it apart from a NevaBridge error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EdgeError"

    SubmissionConflict:
      description: |
        Either another caller is finalizing or recovering delivery for this
        report, or the selected model is unavailable for a permanent reason,
        or the product is archived (`ProductArchived`) or being deleted
        (`ProductPurging`). A generic Conflict body means the submission is in
        progress and can be retried. A ModelInvocationError identifies
        access-denied or model-retired finalizer failures through its
        `category`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ModelInvocationError"

    AttachmentsForbidden:
      description: |
        The tenant does not have the `chatAttachments` entitlement, or the key's
        tenant may not reach the requested resource. The message names the
        feature when the entitlement is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    StorageAllowanceExceeded:
      description: |
        The tenant's 5 GB attachment allowance cannot hold the file. The body
        carries the bytes still free.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StorageAllowanceExceededError"

    StorageFailure:
      description: |
        File storage failed while handling the request (`FailedDependency`).
        Retryable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: An unexpected server or persistence failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ActorRole:
      type: string
      enum: [anonymous, customer, tenant]
      description: An independent knowledge audience grant.

    ProductId:
      type: string
      description: A NevaBridge product id.
      pattern: "^product-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"

    ConversationId:
      type: string
      description: A NevaBridge conversation id.
      pattern: "^conversation-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"

    ReportId:
      type: string
      description: A NevaBridge report id.
      pattern: "^report-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"

    WriterModelKey:
      type: string
      description: |
        A writer model key from the NevaBridge model catalog. The catalog is
        data and changes without a contract change, so the key is not
        enumerated here; a key the catalog does not hold as a live writer, or
        that the product and tenant do not enable, is refused with 400.
      example: amazon-nova-pro

    ApplicationContext:
      type: object
      description: |
        Opaque context from the reporting application, in the tenant's own
        vocabulary. NevaBridge stores it, shows it in triage, and renders it into
        the delivered issue. It never interprets keys or values, and it is
        independent of the `X-Actor-*` headers.
      propertyNames:
        maxLength: 128
      additionalProperties:
        type: string
        maxLength: 1024
      maxProperties: 50

    UserMessage:
      type: object
      description: One message from the reporter.
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32768
          description: What the reporter wrote, verbatim.
        writerModelKey:
          description: Selects the writer at creation. Later messages may repeat the pinned key but cannot change it (400). Historical unpinned conversations retain per-message overrides.
          anyOf:
            - $ref: "#/components/schemas/WriterModelKey"
            - type: "null"
        responseLanguage:
          type: string
          description: Optional BCP 47 response language for this turn. A valid tag takes precedence over automatic detection. An invalid tag is ignored.
      required: [content]
      additionalProperties: false

    ReporterRole:
      type: object
      description: |
        Who is reporting, so the interviewer can adapt its tone and how deeply it
        probes. Free-form for now.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          minLength: 1
          maxLength: 4096
      required: [name, description]
      additionalProperties: false

    StartConversationRequest:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/UserMessage"
        templateId:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          description: |
            The report template to use. When supplied together with `category`,
            the two must agree. When omitted, NevaBridge resolves the
            category's product default template and then that category's
            system starter template.
        category:
          oneOf:
            - $ref: "#/components/schemas/ConversationCategory"
            - type: "null"
        applicationContext:
          oneOf:
            - $ref: "#/components/schemas/ApplicationContext"
            - type: "null"
        reporterRole:
          oneOf:
            - $ref: "#/components/schemas/ReporterRole"
            - type: "null"
      required: [userMessage]
      additionalProperties: false

    ReporterContact:
      type: object
      description: |
        How the tenant's team can reach the reporter, as the tenant's
        application already knows it. NevaBridge stores it with the
        conversation, does not ask the reporter for it again, and copies it into
        every support request filed from the conversation whose template holds
        contact details in fields keyed `contactEmail` and `contactPhone`.
        Holds at least one of them; a value given may not be blank.
      minProperties: 1
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          pattern: "\\S"
        phone:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "\\S"
      additionalProperties: false

    StartIntakeConversationRequest:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/UserMessage"
        applicationContext:
          oneOf:
            - $ref: "#/components/schemas/ApplicationContext"
            - type: "null"
        reporterContact:
          oneOf:
            - $ref: "#/components/schemas/ReporterContact"
            - type: "null"
      required: [userMessage]
      additionalProperties: false

    MessageRole:
      type: string
      enum: [user, assistant]

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]
      additionalProperties: false

    ReportStatusReason:
      type: string
      description: |
        Why a report was closed, when the lifecycle records one. Generic
        Intake closes an intake record as `answered` or
        `follow_up_declined`, and a support request the team cannot reach
        as `no_contact_details`.
      enum:
        - fix_published
        - duplicate
        - wont_fix
        - works_as_designed
        - couldnt_reproduce
        - rejected
        - answered
        - follow_up_declined
        - no_contact_details

    ReportStatus:
      type: string
      description: |
        Where the report stands. `reporting_in_progress` means the reporter is
        still working on it; every other value is a finalized report moving
        through the tenant's own triage.
      enum:
        - reporting_in_progress
        - submitted
        - assigned
        - engineering_in_progress
        - pending_release
        - closed

    IntakeCategory:
      type: string
      description: |
        What kind of artifact the conversation is producing. Absent means
        `bug_report`. `intake_record` is the neutral record of a Generic Intake
        finding no other category fits, including an answered question; it
        never reaches a connector.
      enum: [bug_report, feature_request, support_request, feedback, intake_record]

    ConversationCategory:
      type: string
      description: |
        The conversation category to start. When omitted and no `templateId`
        is supplied, the conversation starts as `support_request`. With only a
        `templateId`, the category derives from that template. A category that
        contradicts the supplied template is rejected with HTTP 400.
      enum: [bug_report, feature_request, support_request]

    Report:
      type: object
      description: |
        The structured artifact the interviewer builds from the conversation.
        `structured` holds the template's fields; its keys depend on the template
        the product uses, so treat it as an open map.
      properties:
        id:
          $ref: "#/components/schemas/ReportId"
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        templateId:
          type: string
        templateVersion:
          type: string
        category:
          $ref: "#/components/schemas/IntakeCategory"
        displayTitle:
          type: string
          description: A short label for the report; absent until the interviewer sets one.
        status:
          $ref: "#/components/schemas/ReportStatus"
        statusReason:
          $ref: "#/components/schemas/ReportStatusReason"
        structured:
          type: object
          additionalProperties:
            type: string
        applicationContext:
          $ref: "#/components/schemas/ApplicationContext"
        submissionOrigin:
          type: string
          description: |
            How the report came to be submitted. Absent means a manual submit.
            `auto_assistant` marks a report submitted during a turn because the
            assistant judged it complete. `auto_abandoned` marks a report the
            server finalized after its inactivity window elapsed.
          enum: [manual, auto_assistant, auto_abandoned]
        writerModel:
          $ref: "#/components/schemas/WriterModelKey"
        deliveries:
          type: array
          description: Connector delivery rows for this report; absent until a delivery exists.
          items:
            $ref: "#/components/schemas/ReportDelivery"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - templateId
        - templateVersion
        - status
        - structured
        - createdAt
        - updatedAt
      additionalProperties: false

    ReportDelivery:
      type: object
      description: The state of one connector delivery for a report.
      properties:
        connectorType:
          $ref: "#/components/schemas/ConnectorType"
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        issueUrl:
          type: string
        externalId:
          type: string
        error:
          type: string
        labelEvidence:
          type: object
          description: |
            Which labels the delivery asked the tracker for, which it attached,
            and which it skipped. Present only for connectors that apply labels.
          properties:
            requested:
              type: array
              items:
                type: string
            attached:
              type: array
              items:
                type: string
            skipped:
              type: array
              items:
                type: string
          required: [requested, attached, skipped]
          additionalProperties: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [connectorType, status, createdAt, updatedAt]
      additionalProperties: false

    ConversationTurn:
      type: object
      description: |
        One completed exchange. `reports` always holds every report of the
        conversation, not a delta, so a live UI can redraw from it without a
        second request. Reports in a turn omit `applicationContext` and
        `deliveries`; read the conversation for those.
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        assistantMessage:
          $ref: "#/components/schemas/Message"
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        displayTitle:
          type: string
          description: Present when this turn set or refreshed the conversation's label.
        connectors:
          type: object
          description: |
            Present only when this turn finalized a report and delivered it,
            because the assistant judged the report complete. Same shape as the
            submit response's `connectors`.
          propertyNames:
            $ref: "#/components/schemas/ConnectorType"
          additionalProperties:
            $ref: "#/components/schemas/ConnectorDeliveryResult"
      required: [userMessage, assistantMessage, reports]
      additionalProperties: false

    AppendMessageRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32768
          description: The reporter's next message, verbatim.
        writerModelKey:
          description: Selects the writer at creation. Later messages may repeat the pinned key but cannot change it (400). Historical unpinned conversations retain per-message overrides.
          anyOf:
            - $ref: "#/components/schemas/WriterModelKey"
            - type: "null"
        responseLanguage:
          type: string
          description: Optional BCP 47 response language for this turn. A valid tag takes precedence over automatic detection. An invalid tag is ignored.
        finish:
          type: boolean
          deprecated: true
          description: |
            Only Generic Intake conversations can be finished, and they take
            their turns through `startIntakeTurn`, so `appendMessage` answers
            400 whenever this is sent.
        expectedRevision:
          type: integer
          minimum: 0
          deprecated: true
          description: Ignored. Generic Intake turns carry it with `startIntakeTurn`.
      required: [content]
      additionalProperties: false

    StartIntakeTurnRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32768
          description: The reporter's next message, verbatim. With `finish`, their closing message.
        writerModelKey:
          description: May repeat the writer the conversation was started with, but cannot change it (400).
          anyOf:
            - $ref: "#/components/schemas/WriterModelKey"
            - type: "null"
        responseLanguage:
          type: string
          description: Optional BCP 47 response language for this turn. A valid tag takes precedence over automatic detection. An invalid tag is ignored.
        finish:
          type: boolean
          description: Ends the conversation and files every draft without a model call.
        expectedRevision:
          type: integer
          minimum: 0
          description: |
            The `revision` of the last `getConversation` read, or of the last
            turn's `done` event. A conversation that has moved past it answers
            409 `RevisionConflict` and adds nothing.
      required: [content, expectedRevision]
      additionalProperties: false

    IntakeTurnId:
      type: string
      description: A Generic Intake turn id.
      pattern: "^intaketurn-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"

    IntakeConversationStarted:
      type: object
      description: A started Generic Intake conversation and its first turn, which runs in the background.
      properties:
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        turnId:
          $ref: "#/components/schemas/IntakeTurnId"
      required: [conversationId, turnId]
      additionalProperties: false

    IntakeTurnStarted:
      type: object
      description: A started Generic Intake turn, which runs in the background.
      properties:
        turnId:
          $ref: "#/components/schemas/IntakeTurnId"
      required: [turnId]
      additionalProperties: false

    IntakeTurnEvents:
      type: object
      description: One read of a turn's events.
      properties:
        events:
          type: array
          description: The events after the cursor, oldest first; the terminal event is always last.
          items:
            $ref: "#/components/schemas/IntakeTurnEvent"
        cursor:
          type: string
          description: Opaque. Send it as `after` to read the events that follow.
        finished:
          type: boolean
          description: True once the terminal event has been returned; no further events follow.
      required: [events, cursor, finished]
      additionalProperties: false

    IntakeTurnEvent:
      description: |
        One event of a turn, told apart by `type`. Known types are `status`,
        `text`, `done` and `error`; ignore any other.
      anyOf:
        - $ref: "#/components/schemas/IntakeTurnStatusEvent"
        - $ref: "#/components/schemas/IntakeTurnTextEvent"
        - $ref: "#/components/schemas/IntakeTurnDoneEvent"
        - $ref: "#/components/schemas/IntakeTurnErrorEvent"
        - $ref: "#/components/schemas/IntakeTurnUnknownEvent"

    IntakeTurnStatusEvent:
      type: object
      description: |
        What the assistant is doing now. Known phases are `checking`,
        `planning`, `writing` and `tool`; a `tool` phase names the tool, one of
        `searchKnowledge`, `inspectTemplate`, `readTranscript` or
        `readAttachment`. Both sets grow without notice: show an unknown phase
        or tool as work in progress.
      properties:
        type:
          type: string
          const: status
        phase:
          type: string
        tool:
          type: string
      required: [type, phase]
      additionalProperties: false

    IntakeTurnTextEvent:
      type: object
      description: |
        The next piece of the assistant's reply, to append to the pieces
        before it. Only a preview: the conversation read after `done` holds
        the reply as saved.
      properties:
        type:
          type: string
          const: text
        delta:
          type: string
      required: [type, delta]
      additionalProperties: false

    IntakeTurnDoneEvent:
      type: object
      description: Terminal. The turn's changes are saved; read the conversation with `getConversation`.
      properties:
        type:
          type: string
          const: done
        revision:
          type: integer
          minimum: 0
          description: The conversation's revision after this turn; the next turn's `expectedRevision`.
      required: [type, revision]
      additionalProperties: false

    IntakeTurnErrorEvent:
      type: object
      description: Terminal. The turn changed nothing; `error` says why.
      properties:
        type:
          type: string
          const: error
        error:
          anyOf:
            - $ref: "#/components/schemas/IntakeTurnFailure"
            - $ref: "#/components/schemas/IntakeTurnModelFailure"
      required: [type, error]
      additionalProperties: false

    IntakeTurnUnknownEvent:
      type: object
      description: An event type added after this version of the contract. Ignore it.
      properties:
        type:
          type: string
          not:
            enum: [status, text, done, error]
      required: [type]

    IntakeTurnFailure:
      type: object
      description: |
        Why a turn failed, as the error body of the request would have
        carried it, with that request's status code. For example 402
        `QuotaExceeded` for an exhausted credit budget, 408
        `IntakeTurnTimedOut` for a turn that did not finish in time, or 409
        `Conflict` when the conversation changed under the turn.
      properties:
        error:
          type: string
          description: A short error name, stable enough to branch on.
        message:
          type: string
          description: A human-readable explanation. Do not parse it.
        statusCode:
          type: integer
          description: The HTTP status the failure would have had as a response.
      required: [error, message, statusCode]
      additionalProperties: false

    IntakeTurnModelFailure:
      type: object
      description: |
        A model failure of the turn, as a ModelInvocationError with the status
        code `ModelInvocationFailure` describes for its `category`.
      properties:
        error:
          type: string
          const: ModelInvocationFailed
        message:
          type: string
          description: A client-safe explanation naming the failing model role.
        category:
          $ref: "#/components/schemas/ModelFailureCategory"
        provider:
          $ref: "#/components/schemas/ModelProvider"
        role:
          $ref: "#/components/schemas/ModelInvocationRole"
        catalogKey:
          type: string
          description: The model catalog key of the failing model.
        statusCode:
          type: integer
          description: The HTTP status the failure would have had as a response.
      required: [error, message, category, provider, role, catalogKey, statusCode]
      additionalProperties: false

    IntakeTurnRunningError:
      type: object
      description: Another turn of the conversation is running; read its events instead of sending again.
      properties:
        error:
          type: string
          const: IntakeTurnRunning
        message:
          type: string
          description: A human-readable explanation. Do not parse it.
        turnId:
          $ref: "#/components/schemas/IntakeTurnId"
      required: [error, message, turnId]
      additionalProperties: false

    ConversationStatus:
      type: string
      description: Derived from the statuses of the conversation's reports.
      enum: [in_progress, closed]

    DeliveryStatus:
      type: string
      enum: [pending, delivered, failed]

    ConnectorType:
      type: string
      enum: [github, gitlab, gitlab-service-desk, jira, linear, slack]

    ConnectorDeliveryResult:
      type: object
      description: |
        The outcome of delivering a report to one connector at submit time.
      oneOf:
        - type: object
          properties:
            status:
              type: string
              const: success
            ticket:
              type: string
              description: The identifier or URL of the issue the connector created.
          required: [status, ticket]
          additionalProperties: false
        - type: object
          properties:
            status:
              type: string
              const: failed
            error:
              type: string
          required: [status, error]
          additionalProperties: false

    ConversationSummary:
      type: object
      description: |
        One row in a product's conversation list. Carries no messages.
      properties:
        writerModelKey:
          type: string
          description: Immutable writer catalog key chosen at creation; absent on historical conversations.
        id:
          $ref: "#/components/schemas/ConversationId"
        tenantId:
          type: string
          description: The tenant selected by the API key.
        productId:
          $ref: "#/components/schemas/ProductId"
        reporterId:
          type: string
          description: The value the tenant sent as `X-Actor-Id` when starting the conversation.
        reporterDisplayName:
          type: string
          description: The reporter's display label, when one was given.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        displayTitle:
          type: string
          description: A short label for the conversation; absent until the interviewer sets one.
        creditsConsumed:
          type: integer
          minimum: 0
          description: Credits charged across completed turns.
        messageCount:
          type: integer
          minimum: 0
          description: Total user and assistant messages in the conversation.
        archivedAt:
          type: string
          format: date-time
          description: Present once the conversation has been archived.
        status:
          $ref: "#/components/schemas/ConversationStatus"
        bugReportStatus:
          $ref: "#/components/schemas/ReportStatus"
        bugReportStatusReason:
          $ref: "#/components/schemas/ReportStatusReason"
        reportId:
          $ref: "#/components/schemas/ReportId"
        deliveries:
          type: array
          description: Delivery state for the primary report, when any exists.
          items:
            $ref: "#/components/schemas/ReportDelivery"
        category:
          $ref: "#/components/schemas/IntakeCategory"
      required:
        [id, tenantId, productId, reporterId, createdAt, updatedAt, status]
      additionalProperties: false

    ConversationDetail:
      type: object
      description: |
        One conversation with everything needed to render it: the full transcript
        and the current state of its reports.
      properties:
        writerModelKey:
          type: string
          description: Immutable writer catalog key chosen at creation; absent on historical conversations.
        id:
          $ref: "#/components/schemas/ConversationId"
        tenantId:
          type: string
          description: The tenant selected by the API key.
        productId:
          $ref: "#/components/schemas/ProductId"
        reporterId:
          type: string
        reporterDisplayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        displayTitle:
          type: string
        archivedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ConversationStatus"
        creditsConsumed:
          type: integer
          minimum: 0
          description: Credits charged across completed turns.
        applicationContext:
          $ref: "#/components/schemas/ApplicationContext"
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        revision:
          type: integer
          minimum: 0
          description: |
            Generic Intake only. The conversation's current revision; send it
            as `expectedRevision` with the next `startIntakeTurn`.
        activeTurnId:
          description: |
            Generic Intake only, while a turn runs: the turn to read with
            `getIntakeTurnEvents`. Absent once it has ended.
          allOf:
            - $ref: "#/components/schemas/IntakeTurnId"
      required:
        [
          id,
          tenantId,
          productId,
          reporterId,
          createdAt,
          updatedAt,
          status,
          reports,
          messages,
        ]
      additionalProperties: false

    IntakeConversationList:
      type: object
      description: One page of Generic Intake conversations.
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        nextCursor:
          type: string
          description: Present while more conversations may follow; send it as `cursor`.
      required: [conversations]
      additionalProperties: false

    SubmitReportResult:
      type: object
      properties:
        report:
          $ref: "#/components/schemas/Report"
        connectors:
          type: object
          description: |
            Delivery outcome per connector, keyed by connector type. Present only
            when the product has active connectors.
          propertyNames:
            $ref: "#/components/schemas/ConnectorType"
          additionalProperties:
            $ref: "#/components/schemas/ConnectorDeliveryResult"
      required: [report]
      additionalProperties: false

    Features:
      type: object
      description: |
        The tenant's effective feature entitlements, `true` when the feature is
        on. NevaBridge adds keys when it documents a new feature; ignore keys
        you do not know.
      properties:
        chatAttachments:
          type: boolean
          description: The Attachments operations are available.
        knowledgebase:
          type: boolean
          description: Conversation turns may ground replies in the tenant's knowledge base.
        genericIntake:
          type: boolean
          description: The tenant can start Generic Intake conversations and their turns with `startIntakeConversation` and `startIntakeTurn`.
      required: [chatAttachments, knowledgebase, genericIntake]
      additionalProperties:
        type: boolean

    Error:
      type: object
      description: The error shape every failed request returns.
      properties:
        error:
          type: string
          description: A short error name, stable enough to branch on.
        message:
          type: string
          description: A human-readable explanation. Do not parse it.
      required: [error, message]
      additionalProperties: false

    ModelInvocationError:
      type: object
      description: A model failure with a machine-readable category for retry decisions.
      properties:
        error:
          type: string
          const: ModelInvocationFailed
        message:
          type: string
          description: A client-safe explanation naming the failing model role.
        category:
          $ref: "#/components/schemas/ModelFailureCategory"
        provider:
          $ref: "#/components/schemas/ModelProvider"
        role:
          $ref: "#/components/schemas/ModelInvocationRole"
        catalogKey:
          type: string
          description: The model catalog key of the failing model.
      required: [error, message, category, provider, role, catalogKey]
      additionalProperties: false

    ModelFailureCategory:
      type: string
      enum:
        - throttled
        - transient-unavailable
        - timed-out
        - access-denied
        - model-retired
        - request-rejected
        - output-unparseable
        - unknown

    ModelProvider:
      type: string
      description: The service that ran the failing model.
      enum:
        - bedrock
        - openrouter

    ModelInvocationRole:
      type: string
      description: The step of the turn the failing model served; `reader` reads an attachment for a Generic Intake turn.
      enum:
        - classifier
        - orchestrator
        - writer
        - finalizer
        - reader

    AttachmentId:
      type: string
      description: A NevaBridge attachment id.
      pattern: "^attachment-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"

    AttachmentKind:
      type: string
      description: The broad file type, derived from the file name's extension.
      enum: [image, video, text]

    Attachment:
      type: object
      description: One confirmed file attached to a conversation.
      properties:
        id:
          $ref: "#/components/schemas/AttachmentId"
        fileName:
          type: string
          description: The name given when the upload was requested.
        kind:
          $ref: "#/components/schemas/AttachmentKind"
        sizeBytes:
          type: integer
          minimum: 1
        uploadedBy:
          type: string
          description: |
            `api:<X-Actor-Id>` for a file uploaded through this API, or the email
            address of the NevaBridge app user who uploaded it.
        uploadedAt:
          type: string
          format: date-time
      required: [id, fileName, kind, sizeBytes, uploadedBy, uploadedAt]
      additionalProperties: false

    AttachmentList:
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
      required: [attachments]
      additionalProperties: false

    RequestAttachmentUploadRequest:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: The file's name. Its extension decides whether the file is accepted.
        sizeBytes:
          type: integer
          minimum: 1
          description: The exact size of the file. At most 100 MB (100000000 bytes).
      required: [fileName, sizeBytes]
      additionalProperties: false

    RequestAttachmentUploadResponse:
      type: object
      properties:
        attachmentId:
          $ref: "#/components/schemas/AttachmentId"
        uploadUrl:
          type: string
          format: uri
          description: |
            A presigned `PUT` for exactly the declared size. Send the bytes with
            the header `If-None-Match: *`.
        expiresAt:
          type: string
          format: date-time
          description: When `uploadUrl` stops accepting the upload.
      required: [attachmentId, uploadUrl, expiresAt]
      additionalProperties: false

    AttachmentCommandRequest:
      type: object
      properties:
        attachmentId:
          type: string
          minLength: 1
          maxLength: 128
          description: The file to act on, as returned by `requestAttachmentUpload`.
      required: [attachmentId]
      additionalProperties: false

    AttachmentDownloadUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: A presigned `GET` that serves the file for 5 minutes.
      required: [url]
      additionalProperties: false

    StorageAllowanceExceededError:
      type: object
      description: The tenant's attachment allowance cannot hold the requested file.
      properties:
        error:
          type: string
          const: QuotaExceeded
        message:
          type: string
          description: A human-readable explanation. Do not parse it.
        remainingBytes:
          type: integer
          minimum: 0
          description: Bytes still free in the tenant's allowance.
      required: [error, message, remainingBytes]
      additionalProperties: false

    EdgeError:
      type: object
      description: The body API Gateway sends when it gives up on a request.
      properties:
        message:
          type: string
      required: [message]
